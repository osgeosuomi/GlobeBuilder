[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[project]
name = "globe-builder"
requires-python = ">=3.12"
version = "0.0.0.post0"
description = "QGIS plugin for adding globe visualization to the current map or layout."
readme = "README.md"
dependencies = ["qgis_plugin_tools"]
build = ["uv"]

[project.entry-points."qgis_plugin_dev_tools"]
globe_builder = "globe_builder"

[tool.uv.build-backend]
module-name = "globe_builder"
include = [
  "py.typed",
  "metadata.txt",
  "resources/**/*",
  "**/*.svg",
  "**/*.ts",
  "**/*.ui",
]

[tool.qgis_plugin_dev_tools]
plugin_package_name = "globe_builder"
runtime_requires = ["qgis_plugin_tools"]
version_number_source = "pyproject"
translation_language_codes = ["fi"]
translation_search_paths = ["src/globe_builder"]
translation_destination_path = "src/globe_builder/resources/i18n"
translation_pylupdate_command = "pylupdate6"

[tool.uv]
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  # Debugging
  "debugpy==1.5.1",
  # Testing
  "pytest>=9.1.1",
  "pytest-qt",
  "pytest-qgis",
  "pytest-mock",
  # Tools
  "qgis-plugin-dev-tools>=0.13.0",
  "copier",
]
lint = [
  # Linting and formatting (ensure precommit yaml has same versions)
  "prek>=0.5.1",
  "ruff>=0.16.8",
  "mypy>=2",
  "flake8>=7.3.0",
  "bandit>=1.9.4",
  # flake8 plugins
  "flake8-qgis>=2.1.0",
  "flake8-pyproject>=1.2.4",
  "flake8-spellcheck>=0.28.0",
  # Stubs for type checks
  "PyQt6-stubs==20250824",
]

[tool.ruff]
target-version = "py312"
line-length = 88

lint.ignore = [
  "FIX",   # flake8-fixme
  "TD002", # Missing author in TODO
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in `__init__`
  # Conflicting rules (formatter)
  "D203",   # one-blank-line-before-class, D211 used (no-blank-line-before-class)
  "D213",   # multi-line-summary-second-line, D212 used (multi-line-summary-first-line)
  "COM812", # missing-trailing-comma (formatter will enforce this)
  "ISC001", # single-line-implicit-string-concatenation
  "UP037",  # quoted-annotation (quoted annotations are used with TYPE_CHECKING imports)
]

# List of all rules https://docs.astral.sh/ruff/rules/
lint.select = ["ALL"]

lint.unfixable = [
  "F401", # Unused imports
  "F841", # Unused variables
]

# Avoid flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
lint.external = ["SC200", "QGS"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["globe_builder"]

[tool.ruff.lint.per-file-ignores]
"{test,test_integration,test_e2e}/*" = [
  "INP001",
  "D",       # pydocstyle
  "DTZ",     # flake8-datetimez
  "FBT",     # flake8-boolean-trap
  "TD",      # flake8-todos
  "S",       # flake8-bandit
  "SLF",     # flake8-self
  "ANN201",  # Missing return type annotation for public function
  "E501",    # Line too long
  "C901",    # Function is too complex
  "PLR2004", # Magic value used in comparison, consider replacing `2000` with a constant variable
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "ARG001",  # Unused function argument
]

[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
select = ["SC", "QGS"]
extend-ignore = [
  "QGS202", # Experimental, matches any setColor()/setValue() call by method name
]
per-file-ignores = [
  "test/*:SC200,QGS",
  "test_integration/*:SC200,QGS",
  "test_e2e/*:SC200,QGS",
]

[tool.bandit]
exclude_dirs = ["test"]

[tool.mypy]
python_version = "3.12"
follow_imports = "normal"
show_column_numbers = true
check_untyped_defs = true
