[project]
name = "globe-builder"
version = "0.6.0"
description = "QGIS plugin for adding globe visualization to the current map or layout."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Gispo Ltd.", email = "info@gispo.fi" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "qgis_plugin_tools>=1.0.0",
]

[project.urls]
homepage = "https://github.com/GispoCoding/GlobeBuilder"
repository = "https://github.com/GispoCoding/GlobeBuilder"

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  "pre-commit>=4.5.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-qgis>=3.0.0",
  "pytest-qt>=4.4",
  "qgis-plugin-dev-tools>=0.11.0",
]
lint = [
  "mypy>=1.13.0",
  "ruff>=0.15.5",
  "flake8>=7.0.0",
  "flake8-pyproject>=1.2.3",
  "flake8-qgis>=2.0.1",
  "flake8-spellcheck>=0.28.0",
  "PyQt5-stubs",
]

[tool.ruff]
line-length = 88
target-version = "py312"

lint.ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
  "D203",    # Conflicts with D211 (no-blank-line-before-class)
  "D213",    # Conflicts with D212 (multi-line-summary-first-line)
  "G002",    # Logging statement uses %
  "PGH003",  # Use specific rule codes when ignoring type issues
  "PLW1641", # eq-without-hash
]

lint.unfixable = [
  "F401", # Unused imports
  "F841", # Unused variables
]

# List of all rules https://docs.astral.sh/ruff/rules/
lint.select = [
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # flake8, mccabe
  "E",    # flake8, pycodestyle
  "F",    # flake8, Pyflakes
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PGH",  # pygrep-hooks
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "T",    # flake8-print
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # flake8, pycodestyle
]

# Avoiding flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
lint.external = ["SC200", "QGS"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["ALL"]
"**/test/*" = [
  "ANN201",
  "ANN202",
  "E501",
  "INP001",
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert
  "FBT001",  # Boolean-typed positional argument
]

[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
select = ["SC", "QGS"]

per-file-ignores = [
  "*/test/*:INP001,SC200,QGS105",
  "docs/*:SC200",
]

[tool.mypy]
python_version = "3.12"
follow_imports = "normal"
show_column_numbers = true
check_untyped_defs = true
namespace_packages = true
ignore_missing_imports = true
exclude = "^(test|src/globe_builder/test)"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--import-mode=importlib"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-10s (%(filename)s) %(message)s"
log_cli_date_format = "%H:%M:%S"
qt_log_level_fail = "CRITICAL"
qgis_qui_enabled = true

[tool.coverage.run]
branch = true
source_pkgs = ["globe_builder"]
omit = []

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
