qgis_plugin_about: This plugin builds a globe from Natural Earth countries GeoJSON
    and an Azimuthal orthographic projection ("world from space") projection described
    in http://www.statsmapsnpix.com/2019/09/globe-projections-and-insets-in-qgis.html.
    This plugin uses OpenStreetMap Nominatim geocoding API. The OpenStreetMap data
    is licensed under ODbL license. Made with Natural Earth. Free vector and raster
    map data . This plugin lists Sentinel-2 cloudless as an optional data source.
    Sentinel-2 cloudless data by EOX IT Services GmbH (Contains modified Copernicus
    Sentinel data 2017 & 2018) released under Creative Commons Attribution-NonCommercial-ShareAlike
